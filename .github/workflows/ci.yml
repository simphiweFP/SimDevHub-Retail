name: Build verification
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/SimDevHub.Retail.Api/SimDevHub.Retail.Api.csproj
      - run: dotnet test backend/SimDevHub.Retail.Tests/SimDevHub.Retail.Tests.csproj --configuration Release
