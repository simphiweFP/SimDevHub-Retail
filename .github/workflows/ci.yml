name: Build verification
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: retail_integration_tests
          POSTGRES_USER: retail_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_test -d retail_integration_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETAIL_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=retail_integration_tests;Username=retail_test;Password=local-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/SimDevHub.Retail.Api/SimDevHub.Retail.Api.csproj
      - run: dotnet test backend/SimDevHub.Retail.Tests/SimDevHub.Retail.Tests.csproj --configuration Release
